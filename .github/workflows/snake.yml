name: regenerate GD snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jaybondholliete
          outputs: |
            assets/snake.svg?color_snake=#ff2d78&color_dots=#10142e,#134e4a,#0f766e,#14b8a6,#a3e635
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "snake unchanged"
            exit 0
          fi
          git commit -m "chore: regenerate GD snake"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            sleep 3
          done
          exit 1
