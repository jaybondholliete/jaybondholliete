name: regenerate GD snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jaybondholliete
          outputs: |
            assets/snake.svg?color_snake=#ff2d78&color_dots=#10142e,#134e4a,#0f766e,#14b8a6,#a3e635
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate GD snake"
          file_pattern: "assets/snake.svg"
