name: regenerate GD contribution city

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conf/github-profile-3d-contrib.json'
      - '.github/workflows/profile-3d-contrib.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: jaybondholliete
          MAX_REPOS: 100
          SETTING_JSON: conf/github-profile-3d-contrib.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "city unchanged"
            exit 0
          fi
          git commit -m "chore: regenerate GD contribution city"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            sleep 3
          done
          exit 1
