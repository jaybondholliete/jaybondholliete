name: regenerate GD profile panels

on:
  schedule:
    - cron: "30 */24 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conf/**'
      - 'scripts/**'
      - '.github/workflows/readme-panels.yml'

permissions:
  contents: write

concurrency:
  group: readme-panels

jobs:
  panels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate panels
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: jaybondholliete
        run: |
          node gen-banner.js
          node gen-lang-panel.js
          node gen-projects-panel.js
          node gen-latest.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg assets/lang-panel.svg assets/projects-panel.svg assets/latest.svg
          if git diff --cached --quiet; then
            echo "panels unchanged"
            exit 0
          fi
          git commit -m "chore: regenerate GD profile panels"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            sleep 3
          done
          exit 1
